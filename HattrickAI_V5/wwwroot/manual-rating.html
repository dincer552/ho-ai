<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21804a"><title>HattrickAI V5 • Manuel Rating</title>
<style>
:root{--bg:#edf1ee;--card:#fff;--ink:#26332c;--muted:#737c76;--g:#21804a;--p:#2f8444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.page{max-width:1100px;margin:auto;padding:12px}.top,.card{background:var(--card);border-radius:14px;box-shadow:0 2px 9px #0002}.top{padding:12px 15px;display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:21px;font-weight:900}.brand span{color:var(--g)}.crumb{flex:1;color:var(--muted);font-size:12px}.back,.btn,.move{cursor:pointer;font-weight:900;border-radius:9px}.back{border:1px solid #d1ddd5;background:#f6faf7;color:var(--g);padding:9px 12px}.grid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(390px,1.05fr);gap:14px}.card{overflow:hidden;margin-bottom:14px}.head{padding:14px 16px;border-bottom:1px solid #edf1ee}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.08em;color:#7c837f}.title{font-size:20px;font-weight:900;margin-top:3px}.sub{font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px}.controls{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls label{display:block;font-size:10px;font-weight:900;color:#6f7872;margin-bottom:4px}.controls select,.controls input{width:100%;height:39px;border:1px solid #d4dfd7;border-radius:9px;padding:0 10px;background:#fff}.player-list{padding:0 12px 12px;max-height:680px;overflow:auto}.player{border:1px solid #dfe7e1;border-radius:11px;padding:9px;margin-top:8px}.player-main{display:flex;gap:8px;align-items:center}.pname{font-weight:900;font-size:13px;flex:1}.pmeta{font-size:9px;color:#7b837d}.skills{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:7px}.skill{background:#f3f6f4;border-radius:5px;text-align:center;padding:4px 1px}.skill b{display:block;font-size:11px}.skill span{font-size:8px;color:#7a827c}.move{border:0;background:var(--p);color:#fff;padding:8px 10px;font-size:11px}.pitch-wrap{padding:14px}.pitch{position:relative;border-radius:16px;background:linear-gradient(180deg,#2f9a57,#1f7a42);min-height:560px;overflow:hidden;border:2px solid #16703a}.slots{position:absolute;inset:0}.slot{position:absolute;width:84px;margin-left:-42px;text-align:center}.slot .chip{background:#fff;border-radius:12px;padding:7px 5px;box-shadow:0 2px 8px #0003;min-height:54px}.slot .chip.empty{background:#ffffff22;color:#fff;border:1px dashed #ffffff88}.slot .lab{font-size:9px;font-weight:900;color:#0f3d22}.slot .name{font-size:10px;font-weight:900}.slot .x{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-weight:900;cursor:pointer}.board{position:absolute;right:10px;top:10px;background:#0d3a1fcc;color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;min-width:110px}.bottom{padding:12px 14px;display:flex;gap:10px;align-items:center;border-top:1px solid #edf1ee}.count{flex:1;font-size:12px;font-weight:900}.btn{border:0;background:var(--p);color:#fff;padding:11px 16px;font-size:13px}.btn:disabled{opacity:.45}.btn.secondary{background:#eef3ef;color:var(--g);border:1px solid #cfe0d4}.result{padding:0 14px 14px}.ratings{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}.rating{background:#f4f8f5;border-radius:9px;text-align:center;padding:8px 4px}.rating b{display:block;font-size:15px}.rating span{font-size:9px;color:#6d766f;font-weight:900}.status{padding:0 14px 14px;font-size:12px;color:#66706a}.error{margin:0 14px 12px;padding:10px 12px;border-radius:9px;background:#fdecea;color:#a33;font-size:12px;display:none}.json-action{padding:0 14px 14px;display:flex;gap:10px;align-items:center}.json-btn{border:0;background:#1f6feb;color:#fff;padding:9px 12px;border-radius:9px;font-weight:900;font-size:12px;cursor:pointer}.json-btn:disabled{opacity:.45}.empty{padding:18px;color:#7a837d;font-size:13px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>
<main class="page">
<header class="top"><div class="brand">Hattrick<span>AI</span></div><div class="crumb">HatFor • Manuel Rating</div><button class="back" onclick="location.href='/'">← Ana sayfa</button></header>
<div class="grid">
<section><article class="card"><div class="head"><div class="eyebrow">OYUNCU HAVUZU</div><div class="title">CHPP Oyuncuları</div><div class="sub">Oyuncu seç, mevki ata.</div></div>
<div class="controls"><div><label>Formasyon</label><select id="formation"><option>3-5-2</option><option>4-4-2</option><option>4-3-3</option><option>4-5-1</option><option>5-4-1</option><option>5-3-2</option><option>3-4-3</option><option>5-5-0</option><option>2-5-3</option></select></div><div><label>Arama</label><input id="search" placeholder="isim filtrele"></div></div>
<div class="player-list" id="players"><div class="empty">CHPP oyuncuları yükleniyor…</div></div></article></section>
<section><article class="card"><div class="head"><div class="eyebrow">HatFor MANUEL KADRO</div><div class="title" id="teamTitle">Takım kadrosu</div><div class="sub">Hesapla → HatFor sonucu.</div></div>
<div class="pitch-wrap"><div class="pitch" id="pitch"><div class="slots"></div><div class="board" id="board"></div></div></div>
<div class="bottom"><div class="count" id="count">0 / 11</div><button class="btn secondary" id="clear">TEMİZLE</button><button class="btn" id="calculate" disabled>HatFor HESAPLA</button></div>
<div class="result" id="result"></div>
<div class="json-action"><button class="json-btn" id="downloadJson" type="button" disabled>HESAP JSON</button></div>
<div class="status" id="status">Bekleniyor…</div><div class="error" id="error"></div></article></section></div></main>
<script>
const SKILLS=[['keeper','GK'],['defending','DEF'],['playmaking','PM'],['passing','PAS'],['winger','WI'],['scoring','SC'],['setPieces','SP'],['stamina','STA'],['form','Form']];
const FORMATIONS={'3-5-2':['GK','DEF-CL','DEF-C','DEF-CR','W-L','IM-L','IM-C','IM-R','W-R','FW-L','FW-R'],'4-4-2':['GK','WB-L','DEF-CL','DEF-CR','WB-R','W-L','IM-L','IM-R','W-R','FW-L','FW-R'],'4-3-3':['GK','WB-L','DEF-CL','DEF-CR','WB-R','IM-L','IM-C','IM-R','FW-L','FW-C','FW-R'],'4-5-1':['GK','WB-L','DEF-CL','DEF-CR','WB-R','W-L','IM-L','IM-C','IM-R','W-R','FW-C'],'5-4-1':['GK','WB-L','DEF-CL','DEF-C','DEF-CR','WB-R','W-L','IM-L','IM-R','W-R','FW-C'],'5-3-2':['GK','WB-L','DEF-CL','DEF-C','DEF-CR','WB-R','IM-L','IM-C','IM-R','FW-L','FW-R'],'3-4-3':['GK','DEF-CL','DEF-C','DEF-CR','W-L','IM-L','IM-R','W-R','FW-L','FW-C','FW-R'],'5-5-0':['GK','WB-L','DEF-CL','DEF-C','DEF-CR','WB-R','W-L','IM-L','IM-C','IM-R','W-R'],'2-5-3':['GK','DEF-CL','DEF-CR','W-L','IM-L','IM-C','IM-R','W-R','FW-L','FW-C','FW-R']};
const POS={'GK':[50,90],'WB-L':[12,72],'DEF-CL':[32,74],'DEF-C':[50,76],'DEF-CR':[68,74],'WB-R':[88,72],'W-L':[12,48],'IM-L':[32,50],'IM-C':[50,50],'IM-R':[68,50],'W-R':[88,48],'FW-L':[28,22],'FW-C':[50,18],'FW-R':[72,22]};
let players=[],selected=new Map(),lastCalculation=null;
function fmt(v){return (Number(v)||0).toFixed(2)}
function currentSlots(){return FORMATIONS[document.getElementById('formation').value]||FORMATIONS['3-5-2']}
function renderPlayers(){const q=(document.getElementById('search').value||'').toLowerCase();const box=document.getElementById('players');const list=players.filter(p=>!q||String(p.name||'').toLowerCase().includes(q));if(!list.length){box.innerHTML='<div class="empty">Oyuncu yok</div>';return}box.innerHTML=list.map(p=>{const skills=SKILLS.map(([k,l])=>`<div class="skill"><b>${p[k]??0}</b><span>${l}</span></div>`).join('');return `<div class="player"><div class="player-main"><div class="pname">${p.name}</div><div class="pmeta">#${p.id}</div><button class="move" data-id="${p.id}">ATA</button></div><div class="skills">${skills}</div></div>`}).join('');box.querySelectorAll('.move').forEach(btn=>btn.onclick=()=>assignPlayer(Number(btn.dataset.id)))}
function assignPlayer(id){const p=players.find(x=>x.id===id);if(!p)return;const slots=currentSlots();let t=slots.find(s=>!selected.has(s));if(!t){alert('Dolu');return}for(const[s,pl]of selected){if(pl.id===id)selected.delete(s)}selected.set(t,p);renderPitch();updateCount()}
function renderPitch(rating){const slots=currentSlots();const root=document.querySelector('.slots');root.innerHTML='';slots.forEach(code=>{const pos=POS[code]||[50,50];const pl=selected.get(code);const el=document.createElement('div');el.className='slot';el.style.left=pos[0]+'%';el.style.top=pos[1]+'%';el.innerHTML=pl?`<div class="chip"><div class="lab">${code}</div><div class="name">${pl.name.split(' ').slice(-1)[0]}</div><button class="x" data-slot="${code}">×</button></div>`:`<div class="chip empty"><div class="lab">${code}</div><div class="name">boş</div></div>`;root.appendChild(el)});root.querySelectorAll('.x').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.slot);renderPitch();updateCount()});const board=document.getElementById('board');if(rating){board.innerHTML=[['LD',rating.leftDefence],['CD',rating.centralDefence],['RD',rating.rightDefence],['MID',rating.midfield],['LA',rating.leftAttack],['CA',rating.centralAttack],['RA',rating.rightAttack]].map(x=>`<div><span>${x[0]}</span> <b>${fmt(x[1])}</b></div>`).join('')}else board.innerHTML='<div style="opacity:.7">Hesap yok</div>'}
function updateCount(){document.getElementById('count').textContent=selected.size+' / 11';document.getElementById('calculate').disabled=!selected.size}
function payload(){const formation=document.getElementById('formation').value;const slots=[...selected].map(([code,p])=>({code,playerId:p.id,order:'Normal'}));return{lineup:{teamName:document.getElementById('teamTitle').textContent||'Takım',formation,slots},players:players.filter(p=>[...selected.values()].some(s=>s.id===p.id)).map(p=>({id:p.id,name:p.name,keeper:Number(p.keeper||0),defending:Number(p.defending||0),playmaking:Number(p.playmaking||0),passing:Number(p.passing||0),winger:Number(p.winger||0),scoring:Number(p.scoring||0),setPieces:Number(p.setPieces||0),stamina:Number(p.stamina||0),form:Number(p.form||0),experience:Number(p.experience||0),loyalty:Number(p.loyalty||0)})),context:{matchLocation:'Home',attitude:'Normal',tactic:'Normal'},hoContext:{coachModifier:0}}}
async function calc(){const btn=document.getElementById('calculate'),err=document.getElementById('error');err.style.display='none';btn.disabled=true;document.getElementById('status').textContent='HatFor hesaplıyor…';try{const request=payload();const r=await fetch('/api/v5/rating-engine/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const d=await r.json();if(!r.ok)throw Error(d.message||d.detail||'Hata');const v=d.rating||d;renderPitch(v);document.getElementById('result').innerHTML='<div class="eyebrow">HatFor</div><div class="ratings">'+[['DEF-L',v.leftDefence],['DEF-C',v.centralDefence],['DEF-R',v.rightDefence],['MID',v.midfield],['ATT-L',v.leftAttack],['ATT-C',v.centralAttack],['ATT-R',v.rightAttack]].map(x=>`<div class="rating"><b>${fmt(x[1])}</b><span>${x[0]}</span></div>`).join('')+'</div>';lastCalculation={engine:'HatFor',request,response:d};document.getElementById('downloadJson').disabled=false;document.getElementById('status').textContent='Tamam • '+selected.size}catch(e){err.textContent=e.message;err.style.display='block';document.getElementById('status').textContent='Hata'}finally{btn.disabled=!selected.size}}
document.getElementById('calculate').onclick=calc;
document.getElementById('clear').onclick=()=>{selected.clear();renderPitch();updateCount();document.getElementById('result').innerHTML=''};
document.getElementById('formation').onchange=()=>{const keep=new Map(selected);selected.clear();const slots=currentSlots();for(const[s,p]of keep){if(slots.includes(s))selected.set(s,p)}renderPitch();updateCount()};
document.getElementById('search').oninput=renderPlayers;
document.getElementById('downloadJson').onclick=()=>{if(!lastCalculation)return;const blob=new Blob([JSON.stringify(lastCalculation,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hatfor-manual.json';a.click()};
async function load(){try{const r=await fetch('/api/v5/team-player-export');const d=await r.json();if(!r.ok)throw Error(d.message||'Oyuncu yok');players=(d.players||d||[]).map(p=>({id:Number(p.id||p.playerId),name:p.name||('#'+p.id),keeper:Number(p.keeper??0),defending:Number(p.defending??0),playmaking:Number(p.playmaking??0),passing:Number(p.passing??0),winger:Number(p.winger??0),scoring:Number(p.scoring??0),setPieces:Number(p.setPieces??0),stamina:Number(p.stamina??0),form:Number(p.form??0),experience:Number(p.experience??0),loyalty:Number(p.loyalty??0)}));document.getElementById('teamTitle').textContent=d.teamName||d.team||'Takım';document.getElementById('status').textContent=players.length+' oyuncu';renderPlayers();renderPitch();updateCount()}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('players').innerHTML='<div class="empty">CHPP gerekli</div>'}}
load();
</script></body></html>
