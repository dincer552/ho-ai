name: Patch web tactic display

on:
  push:
    branches: [v5]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5
          fetch-depth: 1
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('HattrickAI_V5/wwwroot/index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.lineup-foot{height:69px;padding:10px 25px;display:flex;align-items:center;justify-content:space-between}.lineup-foot span{font-size:16px;color:#737a75}.lineup-foot b{font-size:21px;color:var(--green)}'
          new_css = old_css + '.lineup-tactic{padding:0 25px 12px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #edf1ee}.lineup-tactic span{font-size:13px;color:#737a75;padding-top:10px}.lineup-tactic b{font-size:16px;color:var(--green);padding-top:10px}'
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(old_css, new_css, 1)
          old_html = '<div class="lineup-foot"><span>Önerilen diziliş</span><b id="ownFormation">—</b></div><div class="meta" id="ownMeta">—</div>'
          new_html = '<div class="lineup-foot"><span>Önerilen diziliş</span><b id="ownFormation">—</b></div><div class="lineup-tactic"><span>Seçilen taktik</span><b id="ownTactic">—</b></div><div class="meta" id="ownMeta">—</div>'
          if old_html not in s:
              raise SystemExit('own lineup HTML anchor not found')
          s = s.replace(old_html, new_html, 1)
          old_js = "document.getElementById('ownFormation').textContent=x.ownFormation||x.own?.formation||'—';"
          new_js = old_js + "document.getElementById('ownTactic').textContent=({'Normal':'Normal','CounterAttack':'Kontra Atak','LongShots':'Uzaktan Şutlar','AttackMiddle':'Merkezden Atak','AttackWings':'Kanatlardan Atak','Creative':'Yaratıcı Oyna','Pressing':'Pres'}[x.selectedTactic]||x.selectedTactic||'Normal');"
          if old_js not in s:
              raise SystemExit('JS anchor not found')
          s = s.replace(old_js, new_js, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HattrickAI_V5/wwwroot/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show selected tactic in web lineup'
          git push origin v5
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-web-tactic-display.yml
          git commit -m 'Remove temporary web patch workflow'
          git push origin v5
