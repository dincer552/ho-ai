name: HattrickAI V5 Deploy

on:
  push:
    branches: [v5]
  workflow_dispatch:

concurrency:
  group: v5-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V5
        uses: actions/checkout@v4

      - name: Offline acceptance regression C20
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🧪 V5 C20 deterministic Motor DB JSON regression başlıyor..."
          dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- c20
          echo "✅ V5 C20 deterministic Motor DB JSON regression tamamlandı"

      - name: Build Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "📦 Docker build başlıyor..."
          docker build --pull \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:v5" \
            -f HattrickAI_V5/Dockerfile .
          echo "✅ Docker build tamamlandı"
          echo "🔖 Image: ${IMAGE}:${GITHUB_SHA}"

      - name: Login to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🔐 GHCR login..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "✅ GHCR login tamamlandı"

      - name: Push Docker image to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "📤 GHCR push başlıyor..."
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:v5"
          echo "✅ GHCR push tamamlandı"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via GHCR pull on Azure VM
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🚀 GHCR tabanlı Azure deploy hazır."
          echo "📦 Image: ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "⚠️ VM tarafında GHCR pull agent/cron kurulumu tamamlanmadan SSH'siz deploy mümkün değildir."
          echo "❌ SSH deploy intentionally removed from workflow."
