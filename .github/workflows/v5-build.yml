name: HattrickAI V5 Deploy

on:
  push:
    branches: [v5]
  workflow_dispatch:

concurrency:
  group: v5-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V5
        uses: actions/checkout@v4

      - name: Offline acceptance regression C20
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🧪 V5 C20 deterministic Motor DB JSON regression başlıyor..."
          dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- c20
          echo "✅ V5 C20 deterministic Motor DB JSON regression tamamlandı"

      - name: Build Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "📦 Docker build başlıyor..."
          docker build --pull \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:v5" \
            -f HattrickAI_V5/Dockerfile .
          echo "✅ Docker build tamamlandı"
          echo "🔖 Image: ${IMAGE}:${GITHUB_SHA}"

      - name: Login to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "🔐 GHCR login..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "✅ GHCR login tamamlandı"

      - name: Push Docker image to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "📤 GHCR push başlıyor..."
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:v5"
          echo "✅ GHCR push tamamlandı"

  deploy:
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push

    steps:
      - name: Deploy GHCR image on Azure VM
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          CHPP_CONSUMER_SECRET: ${{ secrets.CHPP_CONSUMER_SECRET }}
        run: |
          set -Eeuo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA}"
          LOG_DIR="/home/azureuser/hattrick-deploy"
          LOG_FILE="${LOG_DIR}/deploy.log"

          mkdir -p "${LOG_DIR}"
          touch "${LOG_FILE}"

          log() {
            printf '[%s] %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$1" | tee -a "${LOG_FILE}"
          }

          cleanup_secrets() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            unset GHCR_TOKEN GHCR_USER CHPP_CONSUMER_SECRET
          }

          trap 'rc=$?; cleanup_secrets; if [ "${rc}" -ne 0 ]; then log "❌ DEPLOY FAILED (exit code ${rc})"; fi; exit "${rc}"' EXIT

          log "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          log "🚀 GHCR VM deployment başladı"
          log "Branch: ${GITHUB_REF_NAME}"
          log "Commit: ${GITHUB_SHA:0:7}"
          log "Image: ${IMAGE}:${TAG}"

          log "🔐 GHCR login..."
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

          log "📥 GHCR image çekiliyor..."
          docker pull "${IMAGE}:${TAG}"

          log "🔒 GHCR credentials temizleniyor..."
          docker logout ghcr.io >/dev/null 2>&1 || true
          unset GHCR_TOKEN GHCR_USER

          log "🛑 Eski container durduruluyor..."
          docker rm -f hattrick-v5 2>/dev/null || true

          log "▶️ Yeni container başlatılıyor..."
          docker run -d \
            --name hattrick-v5 \
            --restart unless-stopped \
            -p 10000:10000 \
            -e CHPP_CONSUMER_SECRET="${CHPP_CONSUMER_SECRET}" \
            -v "${LOG_FILE}:/app/deploy.log:ro" \
            "${IMAGE}:${TAG}"

          unset CHPP_CONSUMER_SECRET

          log "⏳ Container health check bekleniyor..."
          sleep 5

          docker ps --filter "name=hattrick-v5" --filter "status=running" | grep -q hattrick-v5
          health="$(curl --fail --silent --show-error http://127.0.0.1:10000/health)"
          log "❤️ Health: ${health}"
          log "🟢 GHCR VM deployment başarılı"
          log "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          docker image prune -f
