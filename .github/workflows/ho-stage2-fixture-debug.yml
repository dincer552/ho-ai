name: HO Stage-2 Fixture Debug

on:
  push:
    branches: [v5]
  workflow_dispatch:

jobs:
  ho-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run real CHPP HO fixture
        run: dotnet run --project HattrickAI_V5.OfflineTests/HattrickAI_V5.OfflineTests.csproj -- ho-real-fixture
